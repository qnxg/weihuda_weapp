name: Setup Tools

runs:
  using: 'composite'
  steps:
    - name: Install Package Manager
      run: |
        corepack enable
        corepack install

    - name: Setup Node
      uses: https://gitee.com/skr2005/setup-node@641a5f27d9d3241b501f5ae40ac61aa9d04c04ca
      with:
        node-version: lts/*
        cache: 'yarn'

    - name: Yarn Install
      run: yarn install --immutable
