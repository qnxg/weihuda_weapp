name: PR Check

on:
  push: # 允许main分支更新时再检查一遍，这是为了使得action对缓存更友好，见 https://docs.github.com/zh/actions/reference/dependency-caching-reference#restrictions-for-accessing-a-cache
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: https://gitee.com/skr2005/checkout@v5

      - name: Setup
        uses: ./.gitea/workflows/setup-tools

      - name: Run PR Check
        run: npx yarn pr-check
